version: "1.0.0"
# Project Structure Configuration
# Purpose: Define directory structure and file policies
# Used by: DirectoryPolicyResolver for path validation
# Cross-references: artifacts.yaml (validates allowed_artifact_types exist)

directories:
  backend:
    parent: null  # Top-level directory
    description: "Backend application code"
    allowed_artifact_types:
      - dto
      - worker
      - service
    allowed_extensions:
      - ".py"
    require_scaffold_for:
      - "**/*.py"  # All Python files in backend must be scaffolded

  backend/assembly:
    parent: backend
    description: "Application assembly"

  backend/config:
    parent: backend
    description: "Application configuration"

  backend/core:
    parent: backend
    description: "Platform core"

  backend/dtos:
    parent: backend
    description: "Data Transfer Objects"
    allowed_artifact_types:
      - dto  # Override: Only DTOs allowed in this subdirectory
    # Inherits allowed_extensions from parent (implicit)
    # Inherits require_scaffold_for from parent (cumulative)

  backend/services:
    parent: backend
    description: "Orchestration and business logic"
    allowed_artifact_types:
      - service

  backend/utils:
    parent: backend
    description: "Shared utilities"

  backend/workers:
    parent: backend
    description: "Domain operation workers"
    allowed_artifact_types:
      - worker

  tests:
    parent: null
    description: "Test suite root — NO test files here directly"
    allowed_artifact_types: []  # Tests must go in tests/backend/
    allowed_extensions:
      - ".py"
    require_scaffold_for: []

  tests/backend:
    parent: tests
    description: "Backend test suite (default discovery via testpaths in pyproject.toml)"
    allowed_artifact_types:
      - unit_test
      - integration_test
    allowed_extensions:
      - ".py"
    require_scaffold_for: []

  docs:
    parent: null
    description: "Documentation root"
    allowed_artifact_types:
      - research
      - planning
      - design
      - architecture
      - reference
      - generic
    allowed_extensions:
      - ".md"
      - ".rst"
    require_scaffold_for: []

  docs/architecture:
    parent: docs
    description: "System architecture documentation"
    allowed_artifact_types:
      - architecture
      - reference

  docs/development:
    parent: docs
    description: "Development phase documents (research, planning, design)"
    allowed_artifact_types:
      - research
      - planning
      - design

  docs/reference:
    parent: docs
    description: "Reference documentation and guides"
    allowed_artifact_types:
      - reference
      - architecture
      - generic

  docs/reference/tools:
    parent: docs/reference
    description: "MCP server tools reference manuals"
    allowed_artifact_types:
      - generic
      - reference

  docs/manuals:
    parent: docs
    description: "User and developer manuals"
    allowed_artifact_types:
      - generic
      - reference

  docs/setup:
    parent: docs
    description: "Installation and onboarding documentation"
    allowed_artifact_types:
      - generic
      - reference
  docs/coding_standards:
    parent: docs
    description: "Coding standards and conventions"
    allowed_artifact_types:
      - reference

  docs/implementation:
    parent: docs
    description: "Implementation tracking documents"
    allowed_artifact_types:
      - reference

  .pgmcp:
    parent: null
    description: "Platform configuration"
    allowed_artifact_types: []
    allowed_extensions:
      - ".yaml"
      - ".yml"
    require_scaffold_for: []
  scripts:
    parent: null
    description: "Utility scripts (no restrictions)"
    allowed_artifact_types: []
    allowed_extensions: []  # All extensions allowed
    require_scaffold_for: []

  proof_of_concepts:
    parent: null
    description: "Experimental code (no restrictions)"
    allowed_artifact_types: []
    allowed_extensions: []
    require_scaffold_for: []
